<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Cardápio e seus valores{% endblock %}</title>
    <link rel="stylesheet" href="/static/core/css/app.css">
    <script src="https://unpkg.com/htmx.org@1.10.0"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">+</span> Cardápio <em>e seus valores</em></div>
        <nav>
          <a class="active" href="/">[ ] <span>Menu principal</span></a>
          <a href="/atendimento/">[+] <span>Atendimento</span></a>
          <a href="/produtos/">[#] <span>Insumos e produtos</span></a>
          <a href="/relatorios/">[%] <span>Relatórios</span></a>
          <a href="/configuracoes/">[=] <span>Configurações</span></a>
        </nav>
        <div class="sidebar-footer">
          {% if request.user.is_authenticated %}
            <div class="user-info">{{ request.user.username }}</div>
            <a href="{% url 'core:logout' %}" class="btn ghost">Sair</a>
          {% else %}
            <a href="{% url 'core:login' %}" class="btn">Entrar</a>
          {% endif %}
        </div>
      </aside>

      <div class="main-area">
        <header class="main-header">
          <h2>{% block header %}Painel{% endblock %}</h2>
        </header>

        <main class="container">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

  </body>
</html>
