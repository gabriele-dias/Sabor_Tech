<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Sabor Tech{% endblock %}</title>
    <link rel="stylesheet" href="/static/core/css/app.css">
    <script src="https://unpkg.com/htmx.org@1.10.0"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">Sabor Tech</div>
        <nav>
          <a href="/">Cardápio e seus valores</a>
          <a href="/atendimento/">Atendimento</a>
          <a href="/produtos/">Produtos</a>
          <a href="/relatorios/">Relatórios</a>
          <a href="/configuracoes/">Configurações</a>
        </nav>
        <div class="sidebar-footer">
          {% if request.user.is_authenticated %}
            <div class="user-info">{{ request.user.username }}</div>
            <a href="{% url 'core:logout' %}" class="btn ghost">Sair</a>
          {% else %}
            <a href="{% url 'core:login' %}" class="btn">Entrar</a>
          {% endif %}
        </div>
      </aside>

      <div class="main-area">
        <header class="main-header">
          <h2>{% block header %}Painel{% endblock %}</h2>
        </header>

        <main class="container">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

  </body>
</html>
